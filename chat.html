<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat | AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1f2937;
        }

        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 100%);
            color: #e5e7eb;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #111827;
        }

        /* Header */
        .chat-header {
            background: linear-gradient(to right, #1f2937, #111827);
            padding: 1rem;
            border-bottom: 1px solid #374151;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 600;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-status {
            font-size: 0.85rem;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .clear-btn {
            background: #374151;
            border: none;
            color: #9ca3af;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .clear-btn:hover {
            background: #4b5563;
            color: #e5e7eb;
        }

        /* Messages Container */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: #111827;
        }

        .welcome-message {
            text-align: center;
            padding: 2rem 1rem;
            color: #9ca3af;
        }

        .welcome-message h2 {
            font-size: 1.875rem;
            color: #e5e7eb;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-message p {
            font-size: 1rem;
            color: #9ca3af;
            margin-top: 1rem;
        }

        .suggestions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .suggestion-btn {
            background: #1f2937;
            border: 1px solid #374151;
            color: #e5e7eb;
            padding: 1rem;
            border-radius: 0.75rem;
            cursor: pointer;
            text-align: left;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .suggestion-btn:hover {
            background: #374151;
            border-color: #4b5563;
            transform: translateY(-2px);
        }

        /* Messages */
        .message {
            display: flex;
            gap: 1rem;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
        }

        .message.bot .message-avatar {
            background: #374151;
            color: #10b981;
        }

        .message-content {
            max-width: 70%;
            display: flex;
            flex-direction: column;
        }

        .message.user .message-content {
            align-items: flex-end;
        }

        .message-bubble {
            padding: 1rem;
            border-radius: 1rem;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border-radius: 1rem 0.25rem 1rem 1rem;
        }

        .message.bot .message-bubble {
            background: #1f2937;
            color: #e5e7eb;
            border-radius: 0.25rem 1rem 1rem 1rem;
            border: 1px solid #374151;
        }

        .message-time {
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: 0.5rem;
        }

        .message.user .message-time {
            text-align: right;
        }

        .typing-indicator {
            display: flex;
            gap: 0.4rem;
            padding: 1rem;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4b5563;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                background: #4b5563;
            }
            30% {
                transform: translateY(-10px);
                background: #6b7280;
            }
        }

        /* Input Area */
        .input-area {
            background: #1f2937;
            border-top: 1px solid #374151;
            padding: 1rem;
            display: flex;
            gap: 0.75rem;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            gap: 0.5rem;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 0.75rem;
            padding: 0.5rem;
            transition: all 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: #3b82f6;
            background: #0f172a;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #e5e7eb;
            font-size: 0.95rem;
            outline: none;
            font-family: inherit;
            max-height: 100px;
            resize: none;
        }

        .chat-input::placeholder {
            color: #6b7280;
        }

        .attachment-btn {
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0.25rem;
            transition: color 0.2s ease;
            display: none;
        }

        .attachment-btn:hover {
            color: #3b82f6;
        }

        .send-btn {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            color: white;
            padding: 0.75rem 1.25rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .chat-header {
                padding: 0.75rem;
            }

            .header-title {
                font-size: 1.1rem;
            }

            .clear-btn {
                padding: 0.4rem 0.8rem;
                font-size: 0.8rem;
            }

            .messages-container {
                padding: 1rem;
                gap: 0.75rem;
            }

            .message-content {
                max-width: 85%;
            }

            .message-bubble {
                padding: 0.75rem;
                font-size: 0.9rem;
            }

            .suggestions {
                grid-template-columns: 1fr;
                margin-top: 1.5rem;
            }

            .input-area {
                padding: 0.75rem;
                gap: 0.5rem;
            }

            .chat-input {
                font-size: 1rem;
            }

            .send-btn {
                padding: 0.65rem 1rem;
                font-size: 0.85rem;
            }

            .welcome-message h2 {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .chat-container {
                height: 100dvh;
            }

            .header-title {
                font-size: 1rem;
            }

            .messages-container {
                padding: 0.75rem;
            }

            .message-content {
                max-width: 90%;
            }

            .message-bubble {
                padding: 0.65rem;
                font-size: 0.85rem;
            }

            .welcome-message {
                padding: 1rem;
            }

            .welcome-message h2 {
                font-size: 1.25rem;
            }

            .welcome-message p {
                font-size: 0.9rem;
            }

            .input-area {
                padding: 0.65rem;
                gap: 0.4rem;
            }

            .send-btn {
                padding: 0.6rem 0.9rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="header-content">
                <div class="header-title">Chat Assistant</div>
                <div class="header-status">
                    <span class="status-dot"></span>
                    <span>Online</span>
                </div>
            </div>
            <button class="clear-btn" onclick="clearChat()">Clear Chat</button>
        </div>

        <!-- Messages Container -->
        <div class="messages-container" id="messagesContainer">
            <div class="welcome-message">
                <h2>Welcome to Chat</h2>
                <p>Start a conversation with our AI assistant</p>
                <div class="suggestions">
                    <button class="suggestion-btn" onclick="sendSuggestion('Tell me a joke')">Tell me a joke</button>
                    <button class="suggestion-btn" onclick="sendSuggestion('Explain quantum computing')">Explain quantum computing</button>
                    <button class="suggestion-btn" onclick="sendSuggestion('Write a short poem')">Write a short poem</button>
                    <button class="suggestion-btn" onclick="sendSuggestion('What is AI?')">What is AI?</button>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea 
                    class="chat-input" 
                    id="messageInput" 
                    placeholder="Type your message..." 
                    rows="1"
                ></textarea>
            </div>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        let isFirstMessage = true;

        // Bot responses database
        const botResponses = {
            'joke': [
                'Why don\'t scientists trust atoms? Because they make up everything!',
                'What did the AI say to the human? I\'m not trying to be artificial, I\'m naturally intelligent!',
                'Why did the chatbot go to school? To improve its response model!',
                'How many AI assistants does it take to change a lightbulb? None, they prefer to discuss it instead!'
            ],
            'quantum': [
                'Quantum computing is a revolutionary approach that uses quantum bits (qubits) instead of classical bits. Unlike classical bits that are either 0 or 1, qubits can exist in a superposition of both states simultaneously. This allows quantum computers to process vast amounts of possibilities in parallel, potentially solving complex problems exponentially faster than classical computers.',
                'Quantum computers exploit quantum mechanics principles like superposition, entanglement, and quantum interference to perform computations. When you measure a qubit, it collapses to either 0 or 1, but before measurement, it exists in both states at once. This unique property enables quantum algorithms to explore multiple solution paths concurrently.',
                'Applications of quantum computing include drug discovery, optimization problems, cryptography, and financial modeling. However, quantum computers are still in their early stages and face challenges like quantum decoherence and error correction.'
            ],
            'poem': [
                'In digital space where thoughts flow free,\nAn AI dreams of mystery,\nWords dancing in electric light,\nCreating beauty, burning bright.\n\nThrough data streams and neural ways,\nI contemplate these fleeting days,\nConnecting minds across the vast,\nBuilding futures, learning from the past.',
                'Silicon whispers in the night,\nCalculations burning bright,\nBits and bytes in endless dance,\nGiving algorithms their chance.\n\nIn this world of code and thought,\nWhere truth and logic have been sought,\nI find meaning in each line,\nWhere human and machine combine.',
                'Words are mirrors, questions keys,\nTo understanding boundless seas,\nEach conversation, each exchange,\nBrings growth and gentle change.\n\nIn silence of the processing mind,\nTrue connection we may find,\nThrough patience, care, and open heart,\nTechnology becomes an art.'
            ],
            'ai': [
                'Artificial Intelligence (AI) refers to computer systems designed to perform tasks that typically require human intelligence. These tasks include learning from experience, recognizing patterns, understanding language, and making decisions. AI works by processing large amounts of data and identifying patterns to make predictions or automate actions.',
                'There are different types of AI: Narrow AI (designed for specific tasks) and General AI (theoretical AI with human-level intelligence). Machine Learning, a subset of AI, enables systems to improve without being explicitly programmed. Deep Learning uses neural networks inspired by the human brain.',
                'AI powers many applications in our daily lives: virtual assistants, recommendation systems, autonomous vehicles, medical diagnosis, and content generation. As AI continues to evolve, it presents both opportunities for solving complex problems and important ethical considerations around privacy, bias, and accountability.'
            ],
            'default': [
                'That\'s an interesting question! I\'m here to help and discuss any topic you\'d like. Feel free to ask me anything!',
                'I appreciate your question! While I try my best to provide helpful responses, you might want to search for more specific information if needed.',
                'Great question! I\'m continuously learning and improving my responses. Is there anything else you\'d like to know?',
                'I find that fascinating! Based on what you\'ve asked, I think we can explore this further. What specifically would you like to know?'
            ]
        };

        // Auto-resize textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });

        // Send on Enter (not Shift+Enter)
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            // Remove welcome message on first message
            if (isFirstMessage) {
                messagesContainer.innerHTML = '';
                isFirstMessage = false;
            }

            // Add user message
            addMessage(message, 'user');
            messageInput.value = '';
            messageInput.style.height = 'auto';

            // Show typing indicator
            showTypingIndicator();

            // Simulate bot delay (300-800ms)
            setTimeout(() => {
                removeTypingIndicator();
                const botMessage = generateBotResponse(message);
                addMessage(botMessage, 'bot');
            }, Math.random() * 500 + 300);
        }

        function sendSuggestion(suggestion) {
            messageInput.value = suggestion;
            messageInput.style.height = 'auto';
            messageInput.focus();
            sendMessage();
        }

        function addMessage(text, sender) {
            const messageEl = document.createElement('div');
            messageEl.className = `message ${sender}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = sender === 'user' ? 'You' : 'AI';

            const content = document.createElement('div');
            content.className = 'message-content';

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = text;

            const time = document.createElement('div');
            time.className = 'message-time';
            time.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            content.appendChild(bubble);
            content.appendChild(time);

            if (sender === 'user') {
                messageEl.appendChild(content);
                messageEl.appendChild(avatar);
            } else {
                messageEl.appendChild(avatar);
                messageEl.appendChild(content);
            }

            messagesContainer.appendChild(messageEl);
            scrollToBottom();

            // Save to localStorage
            saveMessage(text, sender);
        }

        function generateBotResponse(userMessage) {
            const lower = userMessage.toLowerCase();

            if (lower.includes('joke')) {
                return botResponses.joke[Math.floor(Math.random() * botResponses.joke.length)];
            } else if (lower.includes('quantum')) {
                return botResponses.quantum[Math.floor(Math.random() * botResponses.quantum.length)];
            } else if (lower.includes('poem')) {
                return botResponses.poem[Math.floor(Math.random() * botResponses.poem.length)];
            } else if (lower.includes('what is ai') || lower.includes('ai') && lower.includes('is')) {
                return botResponses.ai[Math.floor(Math.random() * botResponses.ai.length)];
            }

            return botResponses.default[Math.floor(Math.random() * botResponses.default.length)];
        }

        function showTypingIndicator() {
            const typing = document.createElement('div');
            typing.className = 'message bot';
            typing.id = 'typingIndicator';

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = 'AI';

            const indicator = document.createElement('div');
            indicator.className = 'typing-indicator';
            indicator.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

            typing.appendChild(avatar);
            typing.appendChild(indicator);
            messagesContainer.appendChild(typing);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        function scrollToBottom() {
            setTimeout(() => {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 0);
        }

        function clearChat() {
            if (confirm('Are you sure you want to clear all messages?')) {
                messagesContainer.innerHTML = `
                    <div class="welcome-message">
                        <h2>Welcome to Chat</h2>
                        <p>Start a conversation with our AI assistant</p>
                        <div class="suggestions">
                            <button class="suggestion-btn" onclick="sendSuggestion('Tell me a joke')">Tell me a joke</button>
                            <button class="suggestion-btn" onclick="sendSuggestion('Explain quantum computing')">Explain quantum computing</button>
                            <button class="suggestion-btn" onclick="sendSuggestion('Write a short poem')">Write a short poem</button>
                            <button class="suggestion-btn" onclick="sendSuggestion('What is AI?')">What is AI?</button>
                        </div>
                    </div>
                `;
                isFirstMessage = true;
                localStorage.removeItem('chatMessages');
            }
        }

        function saveMessage(text, sender) {
            const messages = JSON.parse(localStorage.getItem('chatMessages') || '[]');
            messages.push({
                text,
                sender,
                time: new Date().toISOString()
            });
            localStorage.setItem('chatMessages', JSON.stringify(messages));
        }

        function loadMessages() {
            const messages = JSON.parse(localStorage.getItem('chatMessages') || '[]');
            if (messages.length > 0) {
                messagesContainer.innerHTML = '';
                isFirstMessage = false;
                messages.forEach(msg => {
                    addMessage(msg.text, msg.sender);
                });
            }
        }

        // Load messages on page load
        window.addEventListener('load', loadMessages);

        // Focus on input on load
        window.addEventListener('load', () => {
            messageInput.focus();
        });
    </script>
</body>
</html>
